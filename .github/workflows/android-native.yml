name: Build (Android Native)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Android Native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # The androidNativeArm64 and androidNativeX64 targets cross-compile on any
      # host. 32-bit targets (androidNativeArm32, androidNativeX86) were retired
      # 2026-06-25 per AGENTS.md §5.5.3. Kotlin/Native test binaries are built by
      # the full target gate; this workflow provides explicit compile coverage
      # for the remaining Android Native targets.
      - name: Compile Android Native targets
        run: >
          ./gradlew
          compileKotlinAndroidNativeArm64
          compileKotlinAndroidNativeX64
          --no-configuration-cache